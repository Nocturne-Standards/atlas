# cargo-deny policy. Run: cargo deny check
#
# Contract builds are bytes that get deployed, so the dependency graph is
# policed three ways: where code may come from (sources), which licences may be
# linked in (licenses), and which crates have known problems (advisories).
# Accepted advisories and their reasons live in .cargo/audit.toml; keep the two
# lists in step.

[graph]
all-features = false
targets = [
    "wasm32-unknown-unknown",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# Unmaintained and unsound crates are reported (warn) wherever they are in the
# graph. Today they are all transitive dependencies of dusk-core or its test
# dependencies and none is in the contract's WASM graph (checked with
# `cargo tree -i <crate> --target wasm32-unknown-unknown`).
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = [
    # rkyv Rc/Arc archive validation. No 0.7 fix; Atlas types contain no Rc or
    # Arc. See .cargo/audit.toml.
    "RUSTSEC-2026-0235",
]

[licenses]
# Everything linked today is under one of these. MPL-2.0 comes from the dusk
# crates (see NOTICE); it is file-level copyleft and those files stay under it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git source: knot-encoding, a dev-dependency used by the end-to-end
# tests, pinned by full revision in crates/atlas/Cargo.toml.
allow-git = ["https://github.com/Nocturne-Standards/knot"]
