# Leak gates for the public repository. The job name `kit-gates` is the
# branch-protection context. ALLOW_PRIVATE_TIER must stay unset here.
name: kit-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kit-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Public marker present
        run: test -f .nocturne-public

      - name: Public-surface leak gate
        run: scripts/check-public-surface.sh
