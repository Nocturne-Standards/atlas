name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
          components: "rustfmt, clippy, rust-src"
      - name: Install jq, python3, ripgrep
        # jq and python3 are already on the runner. ripgrep is not, and the
        # Ubuntu mirror has failed to resolve twice on this job. Take rg from
        # the pinned release tarball instead.
        run: |
          sudo apt-get update || true
          sudo apt-get install -y jq python3
          if ! command -v rg >/dev/null 2>&1; then
            curl -sSfL -o ripgrep.tar.gz https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
            echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  ripgrep.tar.gz" | sha256sum -c -
            tar -xzf ripgrep.tar.gz
            sudo install -m 755 ripgrep-14.1.1-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          fi
          command -v jq
          command -v python3
          command -v rg
      - run: cargo fmt --all --check
      # Contract WASM first: host tests include_bytes! the artifacts, and
      # `make knot-wasm` clones public Nocturne-Standards/knot at the
      # KNOT_REV (Makefile) to build the knot registry, proposals and data WASM.
      - run: make wasm
      - run: make clippy
      - run: make test
      - run: bash scripts/check-bls-insecure.sh
      # Advisory ignores and their reasons live in .cargo/audit.toml.
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit

  evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.7.1
      - run: make evm-fmt
      - run: make evm-test
      - run: make evm-script-test

  # Read-only JS reader (tools/atlas-js). Its tests read atlas-encoding's layout
  # goldens, so a layout change cannot merge without the JS side. Uses the
  # runner's preinstalled Node; the package needs >= 20.10.
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/atlas-js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: node --version
      - run: npm ci --ignore-scripts
      - run: npm test

  # Deploy build: clean, wasm-opt version pinned. The hash is printed in the job
  # summary so the deployments record can be checked against CI.
  release-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
          components: "rust-src"
      - name: Install binaryen 116
        run: |
          curl -sSfL -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz
          echo "c55b74f3109cdae97490faf089b0286d3bba926bb6ea5ed00c8c784fc53718fd  binaryen.tar.gz" | sha256sum -c -
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_116/bin" >> "$GITHUB_PATH"
      - name: Build
        # `shell: bash` turns on pipefail: without it a failed build behind
        # `tee` would leave an unoptimised WASM in place and the job green.
        shell: bash
        run: |
          make release-wasm | tee release-wasm.txt
          grep -q '^sha256: ' release-wasm.txt
      - name: Test the deploy artifact
        # The VM tests normally run against an unoptimised build. Run them
        # against the bytes that will be deployed, and check the tests did not
        # change the file.
        shell: bash
        run: |
          wasm=target/contract/wasm32-unknown-unknown/release/atlas.wasm
          before="$(sha256sum "$wasm" | cut -d' ' -f1)"
          make -C crates/atlas-test-proxy wasm
          make example-wasm
          make knot-wasm
          cargo test --release --locked -p nocturne-atlas
          after="$(sha256sum "$wasm" | cut -d' ' -f1)"
          test "$before" = "$after"
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/contract/wasm32-unknown-unknown/release/atlas.wasm dist/atlas.wasm
          (cd dist && sha256sum atlas.wasm > SHA256SUMS)
          {
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "event: $GITHUB_EVENT_NAME"
            cat release-wasm.txt
          } > dist/BUILD.txt
          {
            echo '### atlas.wasm (release build)'
            echo '```'
            cat dist/BUILD.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-wasm
          path: dist/
          if-no-files-found: error

  # Licence, source and advisory policy for what gets linked in: deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install cargo-deny 0.20.2
        run: |
          curl -sSfL -o cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          echo "$PWD/cargo-deny-0.20.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: cargo-deny check

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so gitleaks scans every commit in the push / PR range.
          fetch-depth: 0
      # The gitleaks Action needs a GITLEAKS_LICENSE secret on organisation
      # repos. The CLI does not.
      - name: Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact
