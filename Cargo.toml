[workspace]
resolver = "2"
members = ["crates/atlas-encoding", "crates/atlas", "crates/atlas-test-proxy", "crates/atlas-event-decoder"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/Nocturne-Standards/atlas"

# Contract bytecode is part of the release: dusk-core 1.7.0 grew the WASM by
# about a third at opt-level 3. Size-optimised build with LTO brings it back
# below the 0.4.0 size. Changing this profile changes the deployed hash.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# knot-encoding (rev f391c92, the dev-dependency pin in crates/atlas) still
# names the rusk git source for dusk-core.
# Redirect that source to the registry so the graph has one dusk-core 1.7.0.
[patch."https://github.com/dusk-network/rusk"]
dusk-core = { version = "=1.7.0" }
