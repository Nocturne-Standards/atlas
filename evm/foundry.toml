[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# Pinned so the deployed bytecode depends only on the source: no IPFS metadata
# hash (it embeds source paths), and the oldest widely supported EVM target.
# solc 0.8.28 emits PUSH0 from Shanghai on. The DuskEVM testnet accepts PUSH0
# and every Cancun opcode (evm/script/chain-check.sh, 2026-10-20), but paris
# needs none of them and runs on any fork, so it stays the target.
evm_version = "paris"
bytecode_hash = "none"
cbor_metadata = false
