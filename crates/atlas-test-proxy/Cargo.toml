[package]
name = "nocturne-atlas-test-proxy"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
atlas-encoding = { package = "nocturne-atlas-encoding", path = "../atlas-encoding", version = "0.5.0" }

[target.'cfg(target_family = "wasm")'.dependencies]
dusk-core = { version = "=1.7.0" }
dusk-forge = "0.3.0"

[features]
contract = ["dusk-core/abi-dlmalloc"]
# dusk_forge::contract check-cfg expects this feature name (unused here).
data-driver = []

[lib]
# Package is published as nocturne-atlas-test-proxy; the Rust path and the built file keep the short name.
name = "atlas_test_proxy"
crate-type = ["cdylib", "rlib"]
